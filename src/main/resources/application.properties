spring.application.name=paymentpulse

spring.datasource.url=jdbc:postgresql://localhost:5432/paymentpulse
spring.datasource.username=postgres
spring.datasource.password=a

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092

# Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer Configuration
spring.kafka.consumer.group-id=paymentpulse-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Allow deserialization of application classes
spring.kafka.consumer.properties.spring.json.trusted.packages=com.paymentpulse.paymentpulse
spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.kafka.consumer.properties.spring.json.value.default.type=com.paymentpulse.paymentpulse.event.TransactionCreatedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

logging.level.org.springframework.kafka=DEBUG
logging.level.org.apache.kafka.clients.producer=DEBUG